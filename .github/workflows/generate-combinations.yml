name: Generate combinations

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Firestore combination job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: combination-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run combination worker
        env:
          JOB_ID: ${{ inputs.jobId }}
          DMR_ALLOW_MUTATIONS: ${{ vars.DMR_ALLOW_MUTATIONS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run combinations:worker -- --job-id "$JOB_ID"
